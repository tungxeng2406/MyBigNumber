<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cong 2 so lon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f4f7f9;
        }
        .card {
            max-width: 900px;
            margin: 60px auto;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .result-box {
            background: #eefaf3;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #cfead9;
        }
        .steps {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-4">
        <h2 class="mb-4 text-center text-success">CHUONG TRINH CONG 2 SO LON</h2>

        <form method="post" action="/add">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstNumber" class="form-label">Nhap so thu nhat</label>
                    <input type="text" class="form-control" id="firstNumber" name="firstNumber" th:value="${firstNumber}" required>
                </div>
                <div class="col-md-6">
                    <label for="secondNumber" class="form-label">Nhap so thu hai</label>
                    <input type="text" class="form-control" id="secondNumber" name="secondNumber" th:value="${secondNumber}" required>
                </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                <button type="submit" class="btn btn-success px-4">Tinh toan</button>
            </div>
        </form>

        <div th:if="${error != null}" class="alert alert-danger mt-4" role="alert">
            <span th:text="${error}">Loi</span>
        </div>

        <div th:if="${result != null}" class="mt-4 result-box">
            <h5 class="text-success">Ket qua</h5>
            <p class="mb-0 fs-5">
                Tong cua <strong th:text="${firstNumber}"></strong> va <strong th:text="${secondNumber}"></strong> la:
                <strong th:text="${result}"></strong>
            </p>
        </div>

        <div th:if="${history != null}" class="mt-4 steps">
            <h5 class="text-success">Quy trinh tinh toan</h5>
            <ol class="mb-0">
                <li th:each="step : ${history}" th:text="${step}"></li>
            </ol>
        </div>
    </div>
</div>
</body>
</html>
